<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Лента</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;

            margin: 0;
            padding: 40px 20px;
        }

        .feed {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .feed-title {
            margin: 0 0 25px;
            color: #333;
            font-size: 28px;
        }

        .post {
            background-color: #ffffff;
            border-radius: 12px;

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);

            padding: 25px;
            margin-bottom: 20px;
        }

        .post-title {
            margin: 0 0 10px;

            font-size: 22px;
            color: #333;
        }

        .post-title a {
            color: inherit;
            text-decoration: none;
        }

        .post-title a:hover {
            color: #4a90e2;
        }

        .post-author {
            margin-bottom: 15px;

            font-size: 14px;
            color: #777;
        }

        .post-author a {
            color: #4a90e2;
            text-decoration: none;
        }

        .post-text {
            margin: 0;

            font-size: 16px;
            line-height: 1.6;

            color: #333;

            white-space: pre-line;
        }

        .post-date {
            margin-top: 20px;

            font-size: 13px;
            color: #999;
        }

        .empty {
            background-color: #ffffff;
            border-radius: 12px;

            padding: 40px;

            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

<div class="feed">

    <h1 class="feed-title">Лента</h1>

    {% for post in posts %}

        <article class="post">

            <h2 class="post-title">
                <a href="{% url 'post' post.id %}">
                    {{ post.title }}
                </a>
            </h2>

            <div class="post-author">
                Автор:
                <a href="{% url 'profile' post.author.id %}">
                    {{ post.author.username }}
                </a>
            </div>

            <p class="post-text">
                {{ post.text }}
            </p>

            <div class="post-date">
                {{ post.created_at }}
            </div>

        </article>

    {% empty %}

        <div class="empty">
            <p>Постов пока нет.</p>
        </div>

    {% endfor %}

</div>

</body>
</html>
