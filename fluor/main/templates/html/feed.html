<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .feed-wrapper {
            width: 100%;
            max-width: 720px;
        }

        .feed-title {
            margin: 0 0 20px 0;
            font-size: 28px;
            line-height: 1.3;
            color: #333333;
            text-align: left;
        }

        .post-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .post-card h2 {
            margin: 0 0 20px 0;
            font-size: 28px;
            line-height: 1.3;
            color: #333333;
            text-align: left;
        }

        .post-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 20px 0;
            font-size: 14px;
            color: #666666;
        }

        .post-meta .author-label {
            color: #999999;
        }

        .post-meta a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .post-meta a:hover {
            color: #357abd;
            text-decoration: underline;
        }

        .post-text {
            margin: 0 0 25px 0;
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
            white-space: pre-line;
            word-wrap: break-word;
        }

        .post-date {
            display: block;
            font-size: 13px;
            color: #999999;
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
        }

        .empty {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            color: #777777;
        }

        .empty p {
            margin: 0;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            body { padding: 20px 12px; }
            .post-card { padding: 25px 20px; }
            .post-card h2 { font-size: 22px; }
            .feed-title { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="feed-wrapper">

    <h1 class="feed-title">Лента</h1>

    {% for post in posts %}

        <article class="post-card">

            <h2>{{ post.title }}</h2>

            <p class="post-meta">
                <span class="author-label">Автор:</span>
                <a href="{% url 'profile' post.author.id %}">
                    {{ post.author.first_name }}
                </a>
            </p>

            <p class="post-text">{{ post.text }}</p>

            <small class="post-date">{{ post.created_at }}</small>

        </article>

    {% empty %}

        <div class="empty">
            <p>Постов пока нет.</p>
        </div>

    {% endfor %}

</div>

</body>
</html>
