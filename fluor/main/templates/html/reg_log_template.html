<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .auth-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            color: #333333;
        }

        .form-group { margin-bottom: 15px; text-align: left; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333333;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .alert-error {
            background-color: #fdecea;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #e74c3c;
            font-size: 14px;
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            color: #e74c3c;
            font-size: 13px;
            text-align: left;
        }

        .form-group.has-error .form-input {
            border-color: #e74c3c;
            background-color: #fff8f8;
        }

        .form-group.has-error .form-input:focus {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.2);
        }

        .form-group.has-error label { color: #e74c3c; }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
            text-decoration: none;
            text-align: center;
        }

        .btn-submit:hover { background-color: #357abd; }
        .btn-submit:active { transform: scale(0.98); }

        .auth-link {
            margin-top: 25px;
            font-size: 14px;
            color: #666666;
        }

        .auth-link a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .auth-link a:hover {
            color: #357abd;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>{{ title }}</h2>

        <form method="post" action="" novalidate>
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="alert-error">
                    Пароль или логин введены неверно
                </div>
            {% endif %}

            {% for field in form %}
                <div class="form-group{% if field.errors %} has-error{% endif %}">
                    <label {{ field.id_for_label }}>{{ field.label }}</label>
                    {{ field }}

                    {% if field.errors %}
                        <ul class="errorlist">
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}

            {% block actions %}{% endblock %}
        </form>
    </div>
</body>
</html>
