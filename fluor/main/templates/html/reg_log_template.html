<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
</head>
<body>
<h1>{{title}}</h1>
<p>{% block message %}{% endblock %}</p>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% block button %}{% endblock %}</button>
</form>
</body>
</html>
