<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .post-wrapper {
            width: 100%;
            max-width: 720px;
        }

        .post-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .post-card h1 {
            margin: 0 0 20px 0;
            font-size: 28px;
            line-height: 1.3;
            color: #333333;
            text-align: left;
        }

        .post-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 20px 0;
            font-size: 14px;
            color: #666666;
        }

        .post-meta .author-label {
            color: #999999;
        }

        .post-meta a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .post-meta a:hover {
            color: #357abd;
            text-decoration: underline;
        }

        .post-text {
            margin: 0 0 25px 0;
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
            white-space: pre-line;
            word-wrap: break-word;
        }

        .post-date {
            display: block;
            font-size: 13px;
            color: #999999;
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
        }

        .btn-back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #4a90e2;
            color: #ffffff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn-back:hover { background-color: #357abd; }
        .btn-back:active { transform: scale(0.98); }

        @media (max-width: 480px) {
            body { padding: 20px 12px; }
            .post-card { padding: 25px 20px; }
            .post-card h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="post-wrapper">
        <article class="post-card">
            <h1>{{ post.title }}</h1>

            <p class="post-meta">
                <span class="author-label">Автор:</span>
                <a href="{% url 'profile' post.author.id %}">
                    {{ post.author.first_name }}
                </a>
            </p>

            <p class="post-text">{{ post.text }}</p>

            <small class="post-date">{{ post.created_at }}</small>
        </article>

        <a class="btn-back" href="{% url 'main' %}">
            ← Назад в ленту
        </a>
    </div>
</body>
</html>
